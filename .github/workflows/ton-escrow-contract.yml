name: TON Escrow Contract CI

on:
  pull_request:
    paths:
      - "contracts/ton-escrow-poc/**"
      - ".github/workflows/ton-escrow-contract.yml"
  push:
    branches:
      - main
      - "feat/ton-escrow-*"
    paths:
      - "contracts/ton-escrow-poc/**"
      - ".github/workflows/ton-escrow-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ton-escrow-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Acton build, ABI and Sandbox tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts/ton-escrow-poc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify frozen artifact verifier tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Verify source-controlled ABI snapshot
        run: python3 scripts/verify_frozen_files.py

      - name: Set up Acton
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://github.com/ton-blockchain/acton/releases/latest/download/acton-installer.sh | sh
          echo "$HOME/.acton/bin" >> "$GITHUB_PATH"
          "$HOME/.acton/bin/acton" --version

      - name: Initialize pinned Acton project
        run: acton init

      - name: Compile contract BoCs
        run: acton build

      - name: Verify generated code and BoC against frozen manifest
        continue-on-error: true # TEMPORARY: remove after the new frozen manifest is committed
        run: python3 scripts/verify_build_matches_manifest.py

      - name: Generate ABI-backed wrappers
        run: |
          acton wrapper --all
          acton wrapper DealEscrow --ts --output wrappers-ts/DealEscrow.gen.ts

      - name: Cross-check fixed StateInit vector with generated Acton wrapper and @ton/core
        run: |
          npm install --no-save --no-package-lock @ton/core@0.63.1 tsx@4.19.2
          npx tsx scripts/verify_state_init_vector.ts > build/state_init_vector.json
          cat build/state_init_vector.json

      - name: Generate ABI message BOC golden vectors with Acton wrapper and @ton/core
        run: |
          npx tsx scripts/verify_message_vectors.ts > build/message_vectors.json
          cat build/message_vectors.json

      - name: Format Tolk sources
        run: acton fmt

      - name: Verify formatted Tolk sources
        run: acton fmt --check

      - name: Static checks
        run: acton check

      - name: Emulator tests with coverage
        run: acton test --coverage --no-studio-reporting

      - name: Upload reproducible contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ton-escrow-acton-artifacts
          path: |
            contracts/ton-escrow-poc/build/**
            contracts/ton-escrow-poc/artifacts/**
            contracts/ton-escrow-poc/wrappers/**
            contracts/ton-escrow-poc/wrappers-ts/**
            contracts/ton-escrow-poc/coverage/**
            contracts/ton-escrow-poc/contracts/**
            contracts/ton-escrow-poc/tests/**
          if-no-files-found: warn
          retention-days: 90
