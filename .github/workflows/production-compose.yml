name: Production Compose validation

on:
  pull_request:
    paths:
      - "docker-compose.production.yml"
      - "frontend/Dockerfile.production"
      - "frontend/nginx.production.conf"
      - ".github/workflows/production-compose.yml"
      - "scripts/production_backup.sh"
      - "scripts/production_restore_drill.sh"
  push:
    branches: [main]
    paths:
      - "docker-compose.production.yml"
      - "frontend/Dockerfile.production"
      - "frontend/nginx.production.conf"
      - ".github/workflows/production-compose.yml"

permissions:
  contents: read

jobs:
  compose-and-image:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: viltara-production-ci-${{ github.run_id }}-${{ github.run_attempt }}
      PROD_DB_NAME: viltara_production
      PROD_DB_USER: viltara_production
      PROD_DB_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PROD_AUTH_SECRET_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      PROD_BOT_TOKEN: "123456:ci-placeholder-token"
      PROD_TELEGRAM_MINI_APP_URL: https://viltara-ci.example
      PROD_TELEGRAM_MINI_APP_DIRECT_LINK: https://t.me/viltara_ci_bot/shop
      PROD_ADMIN_TELEGRAM_IDS: "[]"
      PROD_TON_CONNECT_ALLOWED_DOMAINS: '["viltara-ci.example"]'
      PROD_CORS_ALLOWED_ORIGINS: '["https://viltara-ci.example"]'
      PROD_TON_CONNECT_NETWORK: mainnet
      PROD_VITE_TONCONNECT_APP_URL: https://viltara-ci.example
      PROD_VITE_TONCONNECT_MANIFEST_URL: https://viltara-ci.example/tonconnect-manifest.json
      PROD_POSTGRES_VOLUME_NAME: viltara-ci-volume-${{ github.run_id }}-${{ github.run_attempt }}
      PROD_HTTP_PORT: "8081"
      PROD_TON_CENTER_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose interpolation and private service exposure
        run: |
          docker compose --profile bot -f docker-compose.production.yml config -q
          docker compose --profile bot -f docker-compose.production.yml config --format json > /tmp/viltara-production-compose.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          config = json.loads(Path("/tmp/viltara-production-compose.json").read_text())
          services = config["services"]

          for name in ("db", "redis", "api"):
              if services[name].get("ports"):
                  raise SystemExit(f"{name} must not publish host ports")

          miniapp_ports = services["miniapp"].get("ports", [])
          if not any(
              port.get("host_ip") == "127.0.0.1"
              and str(port.get("published")) == "8081"
              and str(port.get("target")) == "80"
              for port in miniapp_ports
          ):
              raise SystemExit("Mini App must publish only 127.0.0.1:8081 -> 80")

          miniapp_build_args = services["miniapp"].get("build", {}).get("args", {})
          if miniapp_build_args.get("VITE_TELEGRAM_MINI_APP_DIRECT_LINK") != os.environ["PROD_TELEGRAM_MINI_APP_DIRECT_LINK"]:
              raise SystemExit("Mini App share direct link is not passed into the production build")

          # Validate that production cannot silently boot against test infrastructure.
          api_env = services["api"].get("environment", {})
          expected_origin = os.environ["PROD_TELEGRAM_MINI_APP_URL"].rstrip("/")
          origin = urlsplit(expected_origin)
          expected_host = origin.hostname
          if (
              origin.scheme != "https"
              or not expected_host
              or origin.username is not None
              or origin.password is not None
              or origin.path
              or origin.query
              or origin.fragment
          ):
              raise SystemExit("Production Mini App URL must be an HTTPS origin without credentials/path/query")
          if origin.port is not None:
              raise SystemExit("Production Mini App origin must not use a non-default port")
          if api_env.get("TELEGRAM_MINI_APP_URL", "").rstrip("/") != expected_origin:
              raise SystemExit("API Mini App URL differs from the production frontend origin")
          if api_env.get("TON_CONNECT_NETWORK") != "mainnet":
              raise SystemExit("Production TON_CONNECT_NETWORK must be mainnet")
          try:
              allowed_domains = json.loads(api_env["TON_CONNECT_ALLOWED_DOMAINS"])
              cors_origins = json.loads(api_env["CORS_ALLOWED_ORIGINS"])
          except (KeyError, json.JSONDecodeError) as error:
              raise SystemExit("Production domain/CORS allowlists must be valid JSON") from error
          if allowed_domains != [expected_host]:
              raise SystemExit("TON Connect allowlist must contain only the exact production hostname")
          if cors_origins != [expected_origin]:
              raise SystemExit("CORS allowlist must contain only the exact production HTTPS origin")
          database_url = urlsplit(api_env.get("DATABASE_URL", ""))
          if (
              database_url.scheme != "postgresql+asyncpg"
              or database_url.hostname != "db"
              or database_url.port != 5432
              or database_url.username != os.environ["PROD_DB_USER"]
              or database_url.path != "/" + os.environ["PROD_DB_NAME"]
              or database_url.query
              or database_url.fragment
          ):
              raise SystemExit("Production API DATABASE_URL must target the exact private production PostgreSQL database")
          if any(marker in os.environ["PROD_DB_NAME"].lower() for marker in ("preview", "test")):
              raise SystemExit("PROD_DB_NAME must not be a test/Preview database")
          if len(os.environ["PROD_AUTH_SECRET_KEY"]) < 32 or len(os.environ["PROD_DB_PASSWORD"]) < 32:
              raise SystemExit("Production authentication and database secrets must each be at least 32 characters")
          if "TELEGRAM_STARS_TEST_ENABLED" in api_env or "TELEGRAM_STARS_TEST_BOT_TOKEN" in api_env:
              raise SystemExit("Test-only Telegram Stars settings must not be present in production")

          for name in ("api", "bot"):
              env = services[name].get("environment", {})
              if env.get("ENVIRONMENT") != "production" or "PREVIEW_MODE" in env:
                  raise SystemExit(f"{name} has incorrect environment mode")
          print("Production Compose security exposure and environment isolation checks passed.")
          PY
      - name: Validate production Nginx configuration
        run: |
          docker run --rm --add-host api:127.0.0.1 \
            -v "$PWD/frontend/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
      - name: Validate production backup and restore-drill scripts
        run: |
          bash -n scripts/production_backup.sh
          bash -n scripts/production_restore_drill.sh
          docker volume create "$PROD_POSTGRES_VOLUME_NAME"
          docker compose -f docker-compose.production.yml up -d db
          for attempt in $(seq 1 30); do
            if docker compose -f docker-compose.production.yml exec -T db pg_isready -U "$PROD_DB_USER" -d "$PROD_DB_NAME"; then
              break
            fi
            sleep 2
          done
          docker compose -f docker-compose.production.yml exec -T db psql \
            --username "$PROD_DB_USER" --dbname "$PROD_DB_NAME" --set=ON_ERROR_STOP=1 \
            --command "CREATE TABLE alembic_version (version_num varchar(32) NOT NULL); CREATE TABLE users (id integer PRIMARY KEY); CREATE TABLE listings (id integer PRIMARY KEY); CREATE TABLE orders (id integer PRIMARY KEY); INSERT INTO users VALUES (1); INSERT INTO listings VALUES (1); INSERT INTO orders VALUES (1);"
          PROD_BACKUP_DIR=/tmp/viltara-production-ci-backups bash scripts/production_backup.sh
          backup_file="$(find /tmp/viltara-production-ci-backups -maxdepth 1 -type f -name '*.dump' -print -quit)"
          test -n "$backup_file"
          sha256sum -c "$backup_file.sha256"
          bash scripts/production_restore_drill.sh "$backup_file"
      - name: Stop disposable production database fixture
        if: always()
        run: |
          docker compose -f docker-compose.production.yml down --remove-orphans || true
          docker volume rm "$PROD_POSTGRES_VOLUME_NAME" || true
      - name: Build production Mini App image
        run: |
          docker build \
            -f frontend/Dockerfile.production \
            --build-arg VITE_TONCONNECT_APP_URL=https://viltara-ci.example \
            --build-arg VITE_TONCONNECT_MANIFEST_URL=https://viltara-ci.example/tonconnect-manifest.json \
            --build-arg VITE_TELEGRAM_MINI_APP_DIRECT_LINK="$PROD_TELEGRAM_MINI_APP_DIRECT_LINK" \
            -t viltara-miniapp:ci frontend
