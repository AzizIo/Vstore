name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: viltara_test
          POSTGRES_USER: viltara
          POSTGRES_PASSWORD: viltara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viltara -d viltara_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://viltara:viltara_test@localhost:5432/viltara_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests migrations

      - name: Test
        run: pytest --cov=app --cov-report=term-missing -q
