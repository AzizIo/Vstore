name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "docker-compose.preview.yml"
      - "docker-compose.stars-test.yml"
      - ".env.example"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "docker-compose.preview.yml"
      - "docker-compose.stars-test.yml"
      - ".env.example"
      - ".github/workflows/backend.yml"

  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest run for a PR/ref; stale runs waste runner capacity.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: viltara_test
          POSTGRES_USER: viltara
          POSTGRES_PASSWORD: viltara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U viltara -d viltara_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://viltara:viltara_test@localhost:5432/viltara_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Validate Docker Compose configuration
        working-directory: .
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Validate isolated preview Compose configuration
        working-directory: .
        env:
          PREVIEW_DB_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PREVIEW_TON_CONNECT_ALLOWED_DOMAINS: '["viltara-ci.example"]'
          PREVIEW_CORS_ALLOWED_ORIGINS: '["https://viltara-ci.example"]'
          PREVIEW_TON_CONNECT_NETWORK: testnet
          PREVIEW_AUTH_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef
          PREVIEW_BOT_TOKEN: 123456:ci-test-token
          PREVIEW_VITE_TONCONNECT_APP_URL: https://viltara-ci.example
          PREVIEW_VITE_TONCONNECT_MANIFEST_URL: https://viltara-ci.example/tonconnect-manifest.json
        run: |
          docker compose --profile bot -f docker-compose.preview.yml config --quiet
          docker compose --profile bot -f docker-compose.preview.yml config --format json | python -c '
          import json, sys
          config = json.load(sys.stdin)
          services = config["services"]
          assert config.get("name") == "viltara-preview", "Preview project name must stay isolated"
          for name in ("db", "redis", "api", "bot"):
              assert not services[name].get("ports"), f"{name} must not publish host ports"
          miniapp_ports = services["miniapp"].get("ports", [])
          assert len(miniapp_ports) == 1, "Mini App must publish exactly one loopback port"
          port = miniapp_ports[0]
          assert isinstance(port, dict) and port.get("host_ip") == "127.0.0.1", "Mini App must bind to 127.0.0.1 only"
          api_env = services["api"]["environment"]
          bot_env = services["bot"]["environment"]
          assert api_env["DATABASE_URL"] == bot_env["DATABASE_URL"], "API and bot must share Preview DB"
          assert api_env["PREVIEW_MODE"] == "1", "Preview migration guard must be enabled"
          assert api_env["CORS_ALLOWED_ORIGINS"] == json.dumps(["https://viltara-ci.example"]), "Preview CORS must match its origin"
          assert "viltara_preview" in api_env["DATABASE_URL"], "Preview must use its dedicated database"
          assert api_env["AUTH_SECRET_KEY"] == bot_env["AUTH_SECRET_KEY"]
          assert api_env["BOT_TOKEN"] == bot_env["BOT_TOKEN"]
          '

      - name: Validate isolated Telegram Stars test Compose configuration
        working-directory: .
        env:
          TELEGRAM_STARS_TEST_BOT_TOKEN: 123456:test-server-placeholder
          STARS_TEST_DB_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          docker compose -p viltara-stars-test -f docker-compose.stars-test.yml --profile bot --profile tools --profile refund-worker config --quiet
          docker compose -p viltara-stars-test -f docker-compose.stars-test.yml --profile bot --profile tools --profile refund-worker config --format json | python -c '
          import json, sys
          config = json.load(sys.stdin)
          services = config["services"]
          assert config.get("name") == "viltara-stars-test", "Stars test project must have a dedicated name"
          assert set(("db", "migrate", "tools", "bot", "refund-worker")).issubset(services)
          for name, service in services.items():
              assert not service.get("ports"), f"{name} must not publish host ports"
              assert not service.get("env_file"), f"{name} must not load a production env file"
          db_volume = services["db"]["volumes"][0]
          assert db_volume["type"] == "volume"
          assert "stars_test_data" in db_volume["source"]
          assert db_volume["target"] == "/var/lib/postgresql/data"
          app_services = ("migrate", "tools", "bot", "refund-worker")
          for name in app_services:
              env = services[name]["environment"]
              assert env["ENVIRONMENT"] == "test"
              assert env["TELEGRAM_STARS_TEST_ENABLED"] == "true"
              assert env["TELEGRAM_STARS_TEST_BOT_TOKEN"] != env["BOT_TOKEN"]
              assert "viltara_test" in env["DATABASE_URL"]
              assert "@db:" in env["DATABASE_URL"]
          assert "stars_test_data" in config["volumes"]
          '

      - name: Lint
        run: ruff check app tests migrations scripts

      - name: Test
        run: pytest --cov=app --cov-report=term-missing -q
