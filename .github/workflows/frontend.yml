name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      # Reserved example host for manifest artifact validation in CI only.
      VITE_TONCONNECT_APP_URL: https://viltara-ci.example
      VITE_TONCONNECT_MANIFEST_URL: https://viltara-ci.example/tonconnect-manifest.json
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test:coverage

      - name: Build production bundle
        run: npm run build

      - name: Build static preview container
        run: |
          docker build \
            --file Dockerfile.preview \
            --build-arg VITE_TONCONNECT_APP_URL="$VITE_TONCONNECT_APP_URL" \
            --build-arg VITE_TONCONNECT_MANIFEST_URL="$VITE_TONCONNECT_MANIFEST_URL" \
            --tag viltara-miniapp-preview-ci .

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate generated TON Connect manifest and icon
        run: |
          node -e 'const fs = require("node:fs"); const manifest = JSON.parse(fs.readFileSync("dist/tonconnect-manifest.json", "utf8")); if (manifest.url !== process.env.VITE_TONCONNECT_APP_URL || manifest.iconUrl !== process.env.VITE_TONCONNECT_APP_URL + "/tonconnect-icon.png") process.exit(1); if (!fs.existsSync("dist/tonconnect-icon.png")) process.exit(1);'
