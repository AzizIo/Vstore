[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viltara-shop-backend"
version = "0.1.0"
description = "VILTARA SHOP API and Telegram bot"
requires-python = ">=3.13"
dependencies = [
  "aiogram>=3.20,<4.0",
  "alembic>=1.16,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "PyNaCl>=1.5,<2.0",
  "pydantic-settings>=2.7,<3.0",
  "PyJWT>=2.10,<3.0",
  "pytoniq>=0.1.43,<0.2.0",
  "pytoniq-core>=0.2.1,<0.3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "redis>=5.2,<7.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<2.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: tests that require a dedicated PostgreSQL database"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
